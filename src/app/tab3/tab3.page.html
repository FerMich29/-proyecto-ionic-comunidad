<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Mis Favoritos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div *ngIf="favoritos.length > 0">
    <ion-card *ngFor="let perfil of favoritos">
      <ion-item lines="none">
        <ion-avatar slot="start">
          <img [src]="perfil.avatar" alt="Avatar" />
        </ion-avatar>
        <ion-label>
          <h2>{{ perfil.email }}</h2>
          <p>Guardado en favoritos</p>
        </ion-label>
        <ion-button slot="end" fill="clear" color="danger" (click)="eliminarFavorito(perfil.id)">
          <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-item>
    </ion-card>
  </div>

  <div *ngIf="favoritos.length === 0" class="ion-text-center ion-padding">
    <ion-icon name="star" color="medium" style="font-size: 48px;"></ion-icon>
    <p>Aún no has agregado ningún perfil a favoritos.<br>Ve a la pestaña de Búsqueda (Tab 2) para agregar alguno.</p>
  </div>
</ion-content>
