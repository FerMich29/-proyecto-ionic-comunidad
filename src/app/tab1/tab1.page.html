<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar style="--background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);">
    <ion-title class="header-title">Comunidad Escolar</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="background-app">
  <div class="content-wrapper ion-padding">
    
    <!-- Formulario Crear/Editar -->
    <ion-card class="premium-card create-post-card">
      <ion-item lines="none" class="transparent-item user-input-area">
        <ion-avatar slot="start">
          <img [src]="'https://i.pravatar.cc/150?u=' + (usuarioActual?.id || 1)" alt="Mi Avatar" />
        </ion-avatar>
        <ion-textarea 
          class="modern-textarea"
          [placeholder]="editingId ? 'Editando publicación...' : '¿Qué está pasando en la escuela?'"
          [autoGrow]="true"
          rows="2"
          [(ngModel)]="nuevaPublicacion">
        </ion-textarea>
      </ion-item>
      
      <div class="post-actions">
        <ion-button *ngIf="editingId" fill="clear" color="medium" size="small" (click)="resetForm()">
          <ion-icon name="close-outline" slot="start"></ion-icon> Cancelar
        </ion-button>
        <ion-button shape="round" class="btn-gradient-small" (click)="guardar()" [disabled]="!nuevaPublicacion">
          <ion-icon [name]="editingId ? 'save-outline' : 'send'" slot="end"></ion-icon> 
          {{ editingId ? 'Guardar Cambios' : 'Publicar' }}
        </ion-button>
      </div>
    </ion-card>

    <!-- Listado de Publicaciones del Usuario -->
    <div class="feed-container">
      <ion-card *ngFor="let post of publicaciones" class="premium-card post-card">
        
        <ion-item lines="none" class="post-header">
          <ion-avatar slot="start">
            <img [src]="post.avatar" alt="Avatar" />
          </ion-avatar>
          <ion-label>
            <h2 class="post-author">{{ post.autor }}</h2>
            <p class="post-time">{{ post.fecha }}</p>
          </ion-label>

          <!-- Acciones de Editar y Eliminar -->
          <div slot="end">
            <ion-button fill="clear" color="primary" size="small" (click)="editar(post)">
              <ion-icon name="create-outline" slot="icon-only"></ion-icon>
            </ion-button>
            <ion-button fill="clear" color="danger" size="small" (click)="eliminar(post.id)">
              <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
            </ion-button>
          </div>
        </ion-item>

        <ion-card-content class="post-content">
          {{ post.contenido }}
        </ion-card-content>

        <div class="post-footer">
          <ion-button fill="clear" color="medium" class="interact-btn">
            <ion-icon name="heart-outline" slot="start"></ion-icon> {{ post.likes || 0 }} Me gusta
          </ion-button>
          <ion-button fill="clear" color="medium" class="interact-btn">
            <ion-icon name="chatbubble-outline" slot="start"></ion-icon> Comentar
          </ion-button>
        </div>
        
      </ion-card>
    </div>

    <div *ngIf="publicaciones.length === 0" class="empty-state ion-padding ion-text-center">
      <div class="empty-icon-wrapper">
        <ion-icon name="chatbubble-outline"></ion-icon>
      </div>
      <p>Aún no has publicado nada.<br><strong>¡Rompe el hielo!</strong></p>
    </div>

  </div>
</ion-content>
