<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Directorio de la Comunidad</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="card">
    <h2 class="card-title">{{ editingId ? '✏️ Editar mi perfil' : '🙋 Unirme a la comunidad' }}</h2>

    <form (ngSubmit)="submitForm()" class="form-grid">

      <div class="form-group">
        <label>Nombre</label>
        <input type="text" name="fullname" [(ngModel)]="form.fullname" maxlength="30" placeholder="Nombre completo" required />
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="password" [(ngModel)]="form.password" placeholder="••••••" required />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" [(ngModel)]="form.email" maxlength="30" placeholder="correo@ejemplo.com" />
      </div>

      <div class="form-group">
        <label>Teléfono</label>
        <input type="tel" name="phonenumber" [(ngModel)]="form.phonenumber" maxlength="9" placeholder="9 dígitos" pattern="[0-9]{9}" />
      </div>

      <div class="form-group">
        <label>Web personal</label>
        <input type="url" name="web" [(ngModel)]="form.web" maxlength="60" placeholder="http://" />
      </div>

      <div class="form-group">
        <label>Fecha de nacimiento</label>
        <input type="date" name="birthdate" [(ngModel)]="form.birthdate" />
      </div>

      <div class="form-group">
        <label>Nº de hermanos</label>
        <input type="number" name="siblings" [(ngModel)]="form.siblings" min="1" max="50" />
      </div>

      <div class="form-group">
        <label>Salario <span class="badge">{{ form.earnings }}</span></label>
        <input type="range" name="earnings" [(ngModel)]="form.earnings" min="600" max="2000" step="200" />
      </div>

      <div class="form-group">
        <label>Color preferido</label>
        <div class="color-row">
          <input type="color" name="color" [(ngModel)]="form.color" />
          <span class="color-value">{{ form.color }}</span>
        </div>
      </div>

      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" name="premium" [(ngModel)]="form.premium" />
          Cuenta Destacada ⭐
        </label>
      </div>

      <div class="form-group">
        <label>Género</label>
        <div class="radio-row">
          <label class="radio-label">
            <input type="radio" name="genre" value="hombre" [(ngModel)]="form.genre" /> Hombre
          </label>
          <label class="radio-label">
            <input type="radio" name="genre" value="mujer" [(ngModel)]="form.genre" /> Mujer
          </label>
        </div>
      </div>

      <div class="form-group">
        <label>Nivel máximo de estudios</label>
        <select name="studies" [(ngModel)]="form.studies" required>
          <option value="">- Seleccione -</option>
          <option value="eso">ESO</option>
          <option value="bachillerato">Bachillerato</option>
          <option value="cfgm">FP grado medio</option>
          <option value="cfgs">FP grado superior</option>
          <option value="grado">Grado universitario</option>
          <option value="master">Master universitario</option>
        </select>
      </div>

      <div class="form-group full-width">
        <label>Idiomas</label>
        <select name="languages" [(ngModel)]="form.languages" size="4" multiple required>
          <option value="spanish">Español</option>
          <option value="english">Inglés</option>
          <option value="french">Francés</option>
          <option value="german">Alemán</option>
        </select>
      </div>

      <div class="form-group full-width botonera">
        <button type="submit" class="btn-primary">{{ editingId ? 'Guardar cambios' : 'Unirme al directorio' }}</button>
        <button type="button" class="btn-secondary" (click)="resetForm()">Cancelar</button>
      </div>

    </form>
  </div>

  <div class="card">
    <h2 class="card-title">🌐 Miembros de la comunidad</h2>

    <div class="perfil-list">
      <div *ngFor="let p of perfiles" class="perfil-card">
        <div class="perfil-info">
          <strong>{{ p.fullname }}</strong>
          <span class="perfil-email">{{ p.email }}</span>
          <span *ngIf="p.premium == 1" class="badge-premium">⭐ Destacado</span>
        </div>
        <div class="perfil-acciones">
          <button class="btn-chip edit" (click)="editPerfil(p)">Editar</button>
          <button class="btn-chip toggle" (click)="togglePremium(p)">{{ p.premium == 1 ? 'Quitar' : 'Marcar como' }} Destacado</button>
          <button class="btn-chip delete" (click)="deletePerfil(p.id)">Eliminar</button>
        </div>
      </div>

      <p *ngIf="perfiles.length === 0" class="empty-state">Todavía nadie se ha unido al directorio. ¡Sé el primero!</p>
    </div>
  </div>
</ion-content>
