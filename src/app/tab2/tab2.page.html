<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Buscar en el Directorio</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="card">
    <input
      type="text"
      class="search-input"
      placeholder="Buscar por nombre..."
      [(ngModel)]="busqueda"
      (input)="buscar()"
    />

    <div class="perfil-list">
      <div *ngFor="let p of filtrados" class="perfil-card">
        <div class="perfil-info">
          <strong>{{ p.fullname }}</strong>
          <span class="perfil-email">{{ p.email }}</span>
          <span *ngIf="p.premium == 1" class="badge-premium">⭐ Destacado</span>
        </div>
      </div>

      <p *ngIf="filtrados.length === 0" class="empty-state">No se encontraron resultados.</p>
    </div>
  </div>
</ion-content>
